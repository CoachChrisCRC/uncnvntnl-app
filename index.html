<!DOCTYPE html>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Permanent+Marker&family=Special+Elite&display=swap" rel="stylesheet">

    <style>

        }
        .btn-metal {

        .btn-metal:hover {
            border-color: #dc2626;
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(220, 38, 38, 0.25);
